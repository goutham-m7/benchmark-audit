[project]
name = "benchmark-audit"
version = "0.1.0"
description = "Replay leakage, label, judge, and leaderboard audits on public snapshots"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2", "threadpoolctl>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
