name: Offline replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv --offline run pytest
      - run: uv --offline run python -m benchmark_audit audit --output /tmp/audit.json
